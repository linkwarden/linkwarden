name: Mobile Android (build & submit)

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to build
        type: choice
        options:
          - both
          - aab
          - apk
        default: both
      submit:
        description: Submit the AAB to Google Play after building
        type: boolean
        default: true

concurrency:
  group: mobile-android
  cancel-in-progress: false

jobs:
  aab:
    name: Build AAB (production) & submit
    if: ${{ inputs.target == 'both' || inputs.target == 'aab' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform android
          --profile production
          --local
          --non-interactive
          --output build.aab

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: apps/mobile/build.aab
          retention-days: 14

      - name: Submit to Google Play
        if: ${{ inputs.submit }}
        run: >
          eas submit
          --platform android
          --profile production
          --path build.aab
          --non-interactive

  apk:
    name: Build APK (production)
    if: ${{ inputs.target == 'both' || inputs.target == 'apk' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform android
          --profile apk
          --local
          --non-interactive
          --output build.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/build.apk
          retention-days: 14

      - name: Create draft release on linkwarden/builds
        env:
          GH_TOKEN: ${{ secrets.BUILDS_RELEASE_TOKEN }}
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          cp build.apk "linkwarden-v${VERSION}.apk"
          gh release create "apk-v${VERSION}" "linkwarden-v${VERSION}.apk" \
            --repo linkwarden/builds \
            --draft \
            --title "apk-v${VERSION}" \
            --notes ""