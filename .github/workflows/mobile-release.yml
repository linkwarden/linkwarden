name: Mobile (build & submit)

on:
  workflow_dispatch:
    inputs:
      ios:
        description: iOS
        type: choice
        options:
          - Build & submit to App Store Connect
          - Build only
          - Skip
        default: Build & submit to App Store Connect
      aab:
        description: Android (AAB)
        type: choice
        options:
          - Build & submit to Google Play Console
          - Build only
          - Skip
        default: Build & submit to Google Play Console
      apk:
        description: Android (APK)
        type: choice
        options:
          - Build & submit a new GitHub release
          - Build only
          - Skip
        default: Build & submit a new GitHub release

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  ios:
    name: Build iOS (production) & submit
    if: ${{ inputs.ios != 'Skip' }}
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform ios
          --profile production
          --local
          --non-interactive
          --output build.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: apps/mobile/build.ipa
          retention-days: 14

      - name: Submit to App Store Connect
        if: ${{ inputs.ios == 'Build & submit to App Store Connect' }}
        run: >
          eas submit
          --platform ios
          --profile production
          --path build.ipa
          --non-interactive

  aab:
    name: Build AAB (production) & submit
    if: ${{ inputs.aab != 'Skip' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform android
          --profile production
          --local
          --non-interactive
          --output build.aab

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-aab
          path: apps/mobile/build.aab
          retention-days: 14

      - name: Submit to Google Play
        if: ${{ inputs.aab == 'Build & submit to Google Play Console' }}
        run: >
          eas submit
          --platform android
          --profile production
          --path build.aab
          --non-interactive

  apk:
    name: Build APK (production) & release
    if: ${{ inputs.apk != 'Skip' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform android
          --profile apk
          --local
          --non-interactive
          --output build.apk

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-apk
          path: apps/mobile/build.apk
          retention-days: 14

      - name: Create draft release on linkwarden/builds
        if: ${{ inputs.apk == 'Build & submit a new GitHub release' }}
        env:
          GH_TOKEN: ${{ secrets.BUILDS_RELEASE_TOKEN }}
        run: |
          VERSION=$(npx expo config --json | jq -r '.version')
          cp build.apk "linkwarden-v${VERSION}.apk"
          gh release create "apk-v${VERSION}" "linkwarden-v${VERSION}.apk" \
            --repo linkwarden/builds \
            --draft \
            --title "apk-v${VERSION}" \
            --notes ""
