name: Mobile iOS (build & submit)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options:
          - production
        default: production
      submit:
        description: Submit to App Store Connect after building
        type: boolean
        default: true

concurrency:
  group: mobile-ios
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS (eas build --local)
    runs-on: macos-26
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Enable corepack (Yarn 4)
        run: corepack enable
        working-directory: .

      - name: Setup EAS CLI
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          packager: npm
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: .

      - name: Build (local)
        run: >
          eas build
          --platform ios
          --profile ${{ inputs.profile }}
          --local
          --non-interactive
          --output build.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-ipa
          path: apps/mobile/build.ipa
          retention-days: 14

      - name: Submit to App Store Connect
        if: ${{ inputs.submit }}
        run: >
          eas submit
          --platform ios
          --profile production
          --path build.ipa
          --non-interactive
