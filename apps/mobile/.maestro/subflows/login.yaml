# Points the app at E2E_BASE_URL and signs in as TEST_USERNAME.
# The defaults match the seeded user from packages/prisma/seed.js, on a server
# running on this machine (10.0.2.2 is the host's address from the Android emulator).
#
# Sheets slide up after the keyboard opens, so each field is closed with
# Enter and the sheet is given time to settle before the next tap.
appId: app.linkwarden
---
- runFlow: self-hosted-server.yaml
- tapOn: "Login"
- tapOn:
    id: "login-username"
- inputText: ${TEST_USERNAME || "user1"}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "login-password"
- inputText: ${TEST_PASSWORD || "11111111"}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "login-submit"
# iOS offers to save the password once the login sheet closes
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
