appId: app.linkwarden
name: Sign up and verify the email with a code
---
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/self-hosted-server.yaml
- evalScript: ${output.email = "maestro-signup-" + Date.now() + "@lab.test"}
- tapOn: "Sign Up"
- tapOn: "Display Name"
- inputText: "Maestro"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: ${output.email}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Password"
- inputText: ${TEST_PASSWORD || "E2ePassw0rd!"}
- pressKey: Enter
- waitForAnimationToEnd
# The sheet's title is also "Sign Up"
- tapOn:
    text: "Sign Up"
    below: "Password"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Verification code"
    timeout: 30000
- runScript:
    file: ../scripts/verification-email.js
    env:
      MAIL_SINK_URL: ${MAIL_SINK_URL}
      EMAIL: ${output.email}
- assertTrue: ${output.code.length == 6}
- tapOn: "Verification code"
- inputText: ${output.wrongCode}
- runFlow:
    file: ../subflows/verify-code.yaml
    env:
      EXPECT: "Invalid or expired code."
- tapOn: "OK"
- tapOn: ${output.wrongCode}
- eraseText: 6
- inputText: ${output.code}
- runFlow:
    file: ../subflows/verify-code.yaml
    env:
      EXPECT: "Dashboard"
