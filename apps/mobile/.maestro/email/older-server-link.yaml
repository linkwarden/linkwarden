appId: app.linkwarden
name: Sign up on a server from before email codes and verify with the link
tags:
  - older-server
---
# E2E_BASE_URL must point at Linkwarden v2.16 or older, which emails a link
- runFlow: ../subflows/launch.yaml
- runFlow: ../subflows/self-hosted-server.yaml
- evalScript: ${output.email = "maestro-link-" + Date.now() + "@lab.test"}
- tapOn: "Sign Up"
- tapOn: "Display Name"
- inputText: "Maestro"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Email"
- inputText: ${output.email}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Password"
- inputText: ${TEST_PASSWORD || "E2ePassw0rd!"}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    text: "Sign Up"
    below: "Password"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Please verify your email address to continue. Open the link we sent to your inbox to verify and log in automatically."
    timeout: 30000
- assertNotVisible: "Verification code"
- assertVisible: "Resend Email"
- runScript:
    file: ../scripts/verification-email.js
    env:
      MAIL_SINK_URL: ${MAIL_SINK_URL}
      EMAIL: ${output.email}
- assertTrue: ${output.appLink.length > 0}
# What tapping the email's link on the phone opens
- openLink: ${output.appLink}
# iOS asks before opening a link in another app
- tapOn:
    text: "Open"
    optional: true
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
