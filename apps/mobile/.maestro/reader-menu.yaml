appId: app.linkwarden
name: Reader menu doesn't check the last action
onFlowComplete:
  - runScript:
      when:
        true: ${!!output.linkId}
      file: scripts/test-link.js
      env:
        BASE_URL: ${E2E_BASE_URL || "http://localhost:3000"}
        USERNAME: ${TEST_USERNAME || "user1"}
        PASSWORD: ${TEST_PASSWORD || "11111111"}
        ACTION: delete
        LINK_ID: ${output.linkId}
---
- evalScript: ${output.linkName = "Maestro menu " + Date.now()}
- runScript:
    file: scripts/test-link.js
    env:
      BASE_URL: ${E2E_BASE_URL || "http://localhost:3000"}
      USERNAME: ${TEST_USERNAME || "user1"}
      PASSWORD: ${TEST_PASSWORD || "11111111"}
      ACTION: create
      URL: https://example.com
      NAME: ${output.linkName}
- assertTrue: ${!!output.linkId}
- runFlow: subflows/launch.yaml
- runFlow: subflows/login.yaml
# The dashboard's stats also have a "Links" label, so look inside the tab bar
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Links"
          childOf:
            text: "Tab Bar|Toolbar"
            containsDescendants:
              - text: "Dashboard"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Links"
          id: ".*navigation_bar_item_.*_label_view"
- tapOn: "${output.linkName},.*"
# Only iPhone Duo's side bar shows the reader's buttons as native bar items,
# with the menu labeled "More". Elsewhere the menu is drawn by the app and
# there is nothing to check.
- extendedWaitUntil:
    visible: "More"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: "More"
    commands:
      - tapOn: "More"
      - tapOn: "Delete"
      # Keep the link. The alert's buttons sit in the middle of the screen,
      # away from the cover display's edge, where a tap can open Control Center
      - tapOn: "Cancel"
      - waitForAnimationToEnd
      - tapOn: "More"
      - assertVisible:
          text: "Delete"
          selected: false
      - assertNotVisible:
          text: "Delete"
          selected: true
