appId: app.linkwarden
name: Log in and save a link
---
- runFlow: subflows/launch.yaml
- runFlow: subflows/login.yaml
- evalScript: ${output.linkName = "Maestro " + Date.now()}
# The dashboard's stats also have a "Links" label, so look inside the tab bar
- tapOn:
    text: "Links"
    childOf:
      text: "Tab Bar"
- tapOn: "New Link"
- tapOn:
    id: "new-link-url"
- inputText: "https://example.com"
- pressKey: Enter
- waitForAnimationToEnd
- tapOn: "Add Name"
- tapOn:
    id: "new-link-name"
- inputText: ${output.linkName}
- pressKey: Enter
- waitForAnimationToEnd
- tapOn:
    id: "new-link-submit"
# A link row reads as one element: "<name>, <host>, <collection>, <date>"
- extendedWaitUntil:
    visible: "${output.linkName},.*"
    timeout: 15000
