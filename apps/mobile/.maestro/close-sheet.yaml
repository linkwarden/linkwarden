appId: app.linkwarden
name: Close a tall sheet with its close button
onFlowComplete:
  - runScript:
      when:
        true: ${!!output.linkId}
      file: scripts/test-link.js
      env:
        BASE_URL: ${E2E_BASE_URL || "http://localhost:3000"}
        USERNAME: ${TEST_USERNAME || "user1"}
        PASSWORD: ${TEST_PASSWORD || "11111111"}
        ACTION: delete
        LINK_ID: ${output.linkId}
---
- evalScript: ${output.linkName = "Maestro sheet " + Date.now()}
- runScript:
    file: scripts/test-link.js
    env:
      BASE_URL: ${E2E_BASE_URL || "http://localhost:3000"}
      USERNAME: ${TEST_USERNAME || "user1"}
      PASSWORD: ${TEST_PASSWORD || "11111111"}
      ACTION: create
      URL: https://example.com
      NAME: ${output.linkName}
- assertTrue: ${!!output.linkId}
- runFlow: subflows/launch.yaml
- runFlow: subflows/login.yaml
# The dashboard's stats also have a "Links" label, so look inside the tab bar
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Links"
          childOf:
            text: "Tab Bar|Toolbar"
            containsDescendants:
              - text: "Dashboard"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: "Links"
          id: ".*navigation_bar_item_.*_label_view"
- longPressOn: "${output.linkName},.*"
- tapOn: "Edit Link"
# The Edit Link sheet reaches the top of the screen. On iPhone Duo's cover
# display, that is where the status area sits along the right edge, and a tap
# there opens Control Center instead of closing the sheet
- tapOn: "Close Edit Link"
- extendedWaitUntil:
    notVisible: "Close Edit Link"
    timeout: 5000
# The list takes touches again, which it wouldn't with the sheet or Control
# Center still on top
- longPressOn: "${output.linkName},.*"
- assertVisible: "Link Details"
